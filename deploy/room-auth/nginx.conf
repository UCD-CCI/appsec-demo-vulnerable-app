server {
    listen 80;
    server_name _;

    # Warmup / tester room gate — browser Basic Auth (ugly but fine for private testers).
    # Remove by bringing the stack up without docker-compose.room-auth.yml.
    auth_basic           "Break the AI App — room access";
    auth_basic_user_file /etc/nginx/htpasswd;

    location / {
        proxy_pass         http://break-ai-app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Sessions / cookies
        proxy_set_header   Cookie            $http_cookie;
        proxy_pass_header  Set-Cookie;
        # Chat waits on the LLM (LLM_TIMEOUT often 120s); default nginx read timeout is 60s.
        proxy_connect_timeout 10s;
        proxy_send_timeout    180s;
        proxy_read_timeout    180s;
    }
}
